# Registry of places where RunDex looks for running events (docs/INGESTION-PLAN.md).
# tier 1: official site parsed by rules      -> changes auto-applied
# tier 2: official site read by an LLM       -> low-impact changes auto-applied, risky ones reviewed
# tier 3: news, blogs, listings (discovery)  -> always reviewed
# enabled: false means "known but not used yet" (see notes). robots.txt is checked again at fetch time.
sources:
  # ---- tier 2: organizer / official event sites -------------------------------------------
  - id: vietnamtrailseries
    name: Vietnam Trail Series (Topas Travel)
    kind: sitemap
    url: https://vietnamtrailseries.com/sitemap_index.xml
    tier: 2
    url_include: "/(trail-marathon|mountain-marathon|jungle-marathon|ultra-marathon)/"
    refresh_days: 3
    notes: robots.txt allows crawling. Service Agreement asks for citation and restricts commercial use.

  - id: hcmcmarathon
    name: HCMC Marathon (Pulse Active)
    kind: sitemap
    url: https://hcmcmarathon.com/sitemap_index.xml
    tier: 2
    refresh_days: 3
    notes: robots.txt blocks nothing. No terms found.

  - id: rundanang
    name: Danang International Marathon (Pulse Active)
    kind: sitemap
    url: https://rundanang.com/wp-sitemap.xml
    tier: 2
    refresh_days: 3
    notes: robots.txt blocks only /wp-admin/. Terms link not retrievable.

  - id: hanoi-marathon
    name: VPBank Hanoi Marathon
    kind: event_page
    url: https://hanoi-marathon.com/
    tier: 2
    refresh_days: 7
    notes: URL seen in a search result; robots.txt and structure not checked yet.

  - id: irace-vtm
    name: iRace - Vietnam Trail Marathon page
    kind: event_page
    url: https://irace.vn/su-kien/vietnam-trail-marathon/
