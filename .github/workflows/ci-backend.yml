name: CI backend

on:
  push:
    branches: [main]
    paths: ["src/backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["src/backend/**", ".github/workflows/ci-backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rundex
          POSTGRES_PASSWORD: rundex_ci
          POSTGRES_DB: rundex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rundex -d rundex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rundex:rundex_ci@localhost:5432/rundex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rundex-api ./src/backend
