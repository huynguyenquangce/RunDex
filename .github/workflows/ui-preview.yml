name: UI preview

# Keeps docs/ui-preview/index.html in step with the catalog snapshot and the backend status logic.
# Changes to the app screens themselves need the Claude Code agent `ui-preview-sync`
# (it ports them into scripts/ui-preview.template.html).

on:
  push:
    branches: [main]
    paths:
      - "src/backend/catalog/**"
      - "src/backend/app/services/**"
      - "src/backend/app/core/regions.py"
      - "src/backend/app/models.py"
      - "scripts/build_ui_preview.py"
      - "scripts/ui-preview.template.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: pip install -e src/backend
      - run: python scripts/build_ui_preview.py
      - name: Commit the refreshed preview
        run: |
          if git diff --quiet -- docs/ui-preview/index.html; then
            echo "UI preview is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-preview/index.html
          git commit -m "chore: refresh UI preview [skip ci]"
          git push
