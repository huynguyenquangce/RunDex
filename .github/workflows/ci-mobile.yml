name: CI mobile

on:
  push:
    branches: [main]
    paths: ["src/mobile/**", ".github/workflows/ci-mobile.yml"]
  pull_request:
    paths: ["src/mobile/**", ".github/workflows/ci-mobile.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Add lint and test steps as soon as they exist (planned: eslint, jest).
